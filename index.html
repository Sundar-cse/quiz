<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quiz Maker</h1>
        <p>Create your own quiz</p>
    </header>

    <main>
        <section id="quiz-details" class="card">
            <h2>Quiz Details</h2>

            <label for="quizTitle">Quiz Title</label>
            <input type="text" id="quizTitle" placeholder="Enter quiz title">

            <label for="quizDescription">Description</label>
            <textarea id="quizDescription" placeholder="Enter quiz description"></textarea>
        </section>

        <section id="questions" class="card">
            <div class="section-heading">
                <h2>Questions</h2>
                <span id="questionCount">0 questions</span>
            </div>

            <div id="questionList"></div>

            <button type="button" id="addQuestion" class="secondary-btn">+ Add Question</button>
        </section>

        <section id="quiz-actions" class="card actions">
            <button type="button" id="previewQuiz">Preview Quiz</button>
            <button type="button" id="saveQuiz">Save Quiz</button>
        </section>

        <section id="preview" class="card preview hidden">
            <div class="section-heading">
                <h2>Quiz Preview</h2>
                <button type="button" id="closePreview" class="small-btn">Close</button>
            </div>
            <div id="previewContent"></div>
        </section>
    </main>

    <footer>
        <p>Quiz Maker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
